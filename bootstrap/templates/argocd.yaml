apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Deploys first
spec:
  project: default
  sources:
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      ref: values
    - repoURL: https://argoproj.github.io/argo-helm # Upstream Chart
      chart: argo-cd
      targetRevision: 9.5.21
      helm:
        valueFiles:
          - $values/platform/argocd/values.yaml # Local configurations
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
